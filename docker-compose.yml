version: "3.9"

services:
  app:
    image: margaritaarunova/backend-course-app:latest
    container_name: backend-course-app
#    depends_on:
#      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-socialdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-socialuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-socialpass}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-0.5}'
          memory: ${APP_MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${APP_CPU_RESERVATION:-0.2}'
          memory: ${APP_MEMORY_RESERVATION:-256M}
    ports:
      - "8080:8080"

  app-additional:
    image: margaritaarunova/backend-course-additional-app:latest
    environment:
      BACKEND_APP_URL: ${BACKEND_APP_URL:-http://localhost:8080}
    container_name: backend-course-additional-app
    deploy:
      resources:
        limits:
          cpus: '${APP_ADDITIONAL_CPU_LIMIT:-0.5}'
          memory: ${APP_MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${APP_ADDITIONAL_CPU_RESERVATION:-0.2}'
          memory: ${APP_MEMORY_RESERVATION:-256M}
    ports:
      - "8081:8081"

