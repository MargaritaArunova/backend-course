server.port=8080
server.shutdown=graceful

fixedRate.in.milliseconds=1000
statisticsservice.infostring=LINES
statistics.service=console10000

# Observability settings
observability.window.short=10
observability.window.medium=30
observability.window.long=60
observability.cleanup.interval=${OBSERVABILITY_CLEANUP_INTERVAL:10000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/socialdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:socialuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:socialpass}
spring.datasource.driver-class-name=org.postgresql.Driver

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Kafka settings
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=backend-course-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka topic configuration
kafka.topic.name=entity-operations
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topic.replication-factor=1
kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
