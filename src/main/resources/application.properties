fixedRate.in.milliseconds=1000
statisticsservice.infostring=LINES
statistics.service=console10000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/socialdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:socialuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:socialpass}
spring.datasource.driver-class-name=org.postgresql.Driver

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
